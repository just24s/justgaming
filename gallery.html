
<!DOCTYPE html>
<html>
<head>
<title>CSS Image Design</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #87CEEB;
}

/* Canvas */
.scene {
  position: relative;
  width: 600px;
  height: 400px;
  background: linear-gradient(#87CEEB 70%, #4CAF50 30%);
  overflow: hidden;
  border-radius: 10px;
}

/* Sun */
.sun {
  position: absolute;
  top: 50px;
  right: 80px;
  width: 80px;
  height: 80px;
  background: #FFD700;
  border-radius: 50%;
  box-shadow: 0 0 40px #FFD700;
}

/* Mountains */
.mountain {
  position: absolute;
  bottom: 120px;
  width: 0;
  height: 0;
  border-left: 120px solid transparent;
  border-right: 120px solid transparent;
  border-bottom: 180px solid #556B2F;
}

.mountain.one {
  left: 50px;
}

.mountain.two {
  left: 200px;
  border-bottom-color: #6B8E23;
}

/* House base */
.house {
  position: absolute;
  bottom: 80px;
  left: 380px;
  width: 120px;
  height: 100px;
  background: #FF7043;
}

/* Roof */
.roof {
  position: absolute;
  bottom: 180px;
  left: 360px;
  width: 0;
  height: 0;
  border-left: 80px solid transparent;
  border-right: 80px solid transparent;
  border-bottom: 80px solid #8B0000;
}

/* Door */
.door {
  position: absolute;
  bottom: 80px;
  left: 430px;
  width: 30px;
  height: 50px;
  background: #5D4037;
}

/* Window */
.window {
  position: absolute;
  bottom: 130px;
  left: 400px;
  width: 25px;
  height: 25px;
  background: #BBDEFB;
  border: 2px solid #333;
}
</style>
</head>

<body>
  <div class="scene">
    <div class="sun"></div>
    <div class="mountain one"></div>
    <div class="mountain two"></div>
    <div class="roof"></div>
    <div class="house"></div>
    <div class="door"></div>
    <div class="window"></div>
  </div>
</body>
</html>
